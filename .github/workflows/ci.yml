name: Offline tests and showcase
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v
      - run: python -m cash_planner --showcase docs/showcase
      - name: Check tracked file sizes
        run: python -c "import pathlib,subprocess; files=subprocess.check_output(['git','ls-files','-z']).decode().split(chr(0)); large=[p for p in files if p and pathlib.Path(p).stat().st_size >= 5_000_000]; assert not large, large"
      - uses: actions/upload-artifact@v4
        with:
          name: offline-report-and-showcase
          path: |
            output/
            docs/showcase/
